<!DOCTYPE html>
<html>
<head>
    <title>教師登入</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f7f7f7;
        }
        .login-container {
            margin-top: 100px;
            max-width: 400px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="login-container shadow">
            <h2 class="text-center mb-4">教師登入</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="teacher_name">用戶名</label>
                    <input type="text" class="form-control" id="teacher_name" name="teacher_name" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">登入</button>
            </form>
            <p class="text-center mt-3">還沒有帳號？<a href="{{ url_for('teacher_register_page') }}">註冊</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                teacher_name: this.teacher_name.value,
                password: this.password.value
            };
            fetch('/teacher/login', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === '登入成功') {
                    window.location.href = '{{ url_for('teacher_dashboard_page') }}';
                } else {
                    alert(data.message);
                }
            });
        };
    </script>
</body>
</html>
