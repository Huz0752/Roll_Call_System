<!DOCTYPE html>
<html>
<head>
    <title>教師登入</title>
</head>
<body>
    <h1>教師登入</h1>
    <form id="loginForm">
        用戶名：<input type="text" name="teacher_name" required><br>
        密碼：<input type="password" name="password" required><br>
        <button type="submit">登入</button>
    </form>
    <p>還沒有帳號？<a href="{{ url_for('teacher_register_page') }}">註冊</a></p>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                teacher_name: this.teacher_name.value,
                password: this.password.value
            };
            fetch('/teacher/login', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === '登入成功') {
                    // noinspection JSUnresolvedVariable
                    window.location.href = '{{ url_for('teacher_dashboard_page') }}';
                } else {
                    alert(data.message);
                }
            });
        };
    </script>
</body>
</html>
