<!DOCTYPE html>
<html>
<head>
    <title>學生主頁</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f7f7f7;
        }
        .container {
            margin-top: 50px;
        }
        .section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        #logoutButton {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-5">歡迎，{{ current_user.student_id }}</h1>

        <div class="section shadow">
            <form id="submitPinForm">
                <div class="form-group">
                    <label for="pin_code">輸入 PIN 碼</label>
                    <input type="text" class="form-control" id="pin_code" name="pin_code" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">提交</button>
            </form>
        </div>

        <div class="text-center">
            <button id="logoutButton" class="btn btn-danger">登出</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        window.onload = function() {
            fetch('/get_pin_code', {
                method: 'GET',
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                if (data.pin_code) {
                    submitPin(data.pin_code);
                }
            });

            function submitPin(pin_code) {
                fetch('/student/submit_pin', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({pin_code})
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.message);
                    fetch('/clear_pin_code', {
                        method: 'POST',
                        credentials: 'include'
                    });
                });
            }
        };

        // 表單提交 PIN 碼的功能
        document.getElementById('submitPinForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                pin_code: this.pin_code.value
            };
            fetch('/student/submit_pin', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
            });
        };

        // 登出按鈕功能
        document.getElementById('logoutButton').onclick = function() {
            fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                window.location.href = '{{ url_for('student_login_page') }}';
            });
        };
    </script>
</body>
</html>
