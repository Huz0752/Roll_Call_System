<!DOCTYPE html>
<html>
<head>
    <title>教師註冊</title>
</head>
<body>
    <h1>教師註冊</h1>
    <form id="registerForm">
        用戶名：<input type="text" name="teacher_name" required><br>
        密碼：<input type="password" name="password" required><br>
        <button type="submit">註冊</button>
    </form>
    <p>已有帳號？<a href="{{ url_for('teacher_login_page') }}">登入</a></p>

    <script>
        document.getElementById('registerForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                teacher_name: this.teacher_name.value,
                password: this.password.value
            };
            fetch('/teacher/register', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                if (data.message === '註冊成功') {
                    // noinspection JSUnresolvedVariable
                    window.location.href = '{{ url_for('teacher_login_page') }}';
                }
            });
        };
    </script>
</body>
</html>
