<!DOCTYPE html>
<html>
<head>
    <title>教師主頁</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f7f7f7;
        }
        .container {
            margin-top: 50px;
        }
        .section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        #pinDisplay {
            margin-top: 20px;
        }
        #qrCodeImage {
            max-width: 200px;
            margin-top: 10px;
        }
        #absentStudents {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-5">歡迎，{{ current_user.teacher_name }}</h1>

        <div class="section shadow">
            <h2>發佈點名 PIN 碼</h2>
            <form id="publishPinForm">
                <div class="form-group">
                    <label for="course_name">課程名稱</label>
                    <input type="text" class="form-control" id="course_name" name="course_name" required>
                </div>
                <div class="form-group">
                    <label for="duration">點名時長（分鐘）</label>
                    <input type="number" class="form-control" id="duration" name="duration" value="5">
                </div>
                <button type="submit" class="btn btn-primary">生成 PIN 碼</button>
            </form>
            <div id="pinDisplay" style="display:none;">
                <h3>PIN 碼：<span id="pinCode" class="text-primary"></span></h3>
                <img id="qrCodeImage" src="" alt="QR Code">
            </div>
        </div>

        <div class="section shadow">
            <h2>上傳學生名單並比較出勤狀況</h2>
            <form id="uploadRosterForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="course_name_roster">課程名稱</label>
                    <input type="text" class="form-control" id="course_name_roster" name="course_name" required>
                </div>
                <div class="form-group">
                    <label for="file">學生名單文件（CSV 或 TXT）</label>
                    <input type="file" class="form-control-file" id="file" name="file" accept=".csv, .txt" required>
                </div>
                <button type="submit" class="btn btn-primary">上傳並比較</button>
            </form>
            <div id="absentStudents" style="display:none;">
                <h3>缺勤統計</h3>
                <div class="alert alert-info mb-3">
                    <span>應到人數：<span id="totalStudents">0</span></span><br>
                    <span>缺勤人數：<span id="absentCount">0</span></span><br>
                    <span>出席率：<span id="attendanceRate">0</span>%</span>
                </div>
                <h3>缺勤學生名單：</h3>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>序號</th>
                            <th>學號</th>
                        </tr>
                    </thead>
                    <tbody id="absentList">
                        <!-- 動態生成的學生列表 -->
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section shadow text-center">
            <button id="exportAttendanceButton" class="btn btn-success mr-2">導出出勤數據</button>
            <button id="logoutButton" class="btn btn-danger">登出</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('publishPinForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                course_name: this.course_name.value,
                duration: this.duration.value
            };
            fetch('/teacher/publish_pin', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.pin_code) {
                    document.getElementById('pinCode').textContent = data.pin_code;
                    document.getElementById('qrCodeImage').src = 'data:image/png;base64,' + data.qr_code;
                    document.getElementById('pinDisplay').style.display = 'block';
                } else {
                    alert(data.message);
                }
            });
        };

        document.getElementById('uploadRosterForm').onsubmit = function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const fileInput = document.getElementById('file');
            const file = fileInput.files[0];
            
            // 先讀取檔案計算總人數
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                const studentList = content.trim().split('\n');
                const totalStudents = studentList.length;
                
                fetch('/teacher/upload_roster', {
                    method: 'POST',
                    credentials: 'include',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.absent_students) {
                        const absentList = document.getElementById('absentList');
                        absentList.innerHTML = '';
                        
                        // 計算統計數據
                        const absentCount = data.absent_students.length;
                        const attendanceRate = Math.round(((totalStudents - absentCount) / totalStudents) * 100);
                        
                        // 更新統計資訊
                        document.getElementById('totalStudents').textContent = totalStudents;
                        document.getElementById('absentCount').textContent = absentCount;
                        document.getElementById('attendanceRate').textContent = attendanceRate;
                        
                        // 顯示缺勤學生列表
                        data.absent_students.sort().forEach((student_id, index) => {
                            const tr = document.createElement('tr');
                            
                            const tdIndex = document.createElement('td');
                            tdIndex.textContent = index + 1;
                            
                            const tdId = document.createElement('td');
                            tdId.textContent = student_id;
                            
                            tr.appendChild(tdIndex);
                            tr.appendChild(tdId);
                            absentList.appendChild(tr);
                        });
                        document.getElementById('absentStudents').style.display = 'block';
                    } else {
                        alert(data.message);
                    }
                });
            };
            reader.readAsText(file);
        };

        document.getElementById('exportAttendanceButton').onclick = function() {
            const course_name = prompt('請輸入要導出出勤數據的課程名稱：');
            if (course_name) {
                window.location.href = '/teacher/export_attendance?course_name=' + encodeURIComponent(course_name);
            }
        };

        document.getElementById('logoutButton').onclick = function() {
            fetch('/logout', {
                method: 'POST',
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                window.location.href = '{{ url_for('teacher_login_page') }}';
            });
        };
    </script>
</body>
</html>
