<!DOCTYPE html>
<html>
<head>
    <title>學生登入</title>
</head>
<body>
    <h1>學生登入</h1>
    <form id="loginForm">
        學號：<input type="text" name="student_id" required><br>
        密碼：<input type="password" name="password" required><br>
        <button type="submit">登入</button>
    </form>
    <p>還沒有帳號？<a href="{{ url_for('student_register_page') }}">註冊</a></p>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                student_id: this.student_id.value,
                password: this.password.value
            };
            fetch('/student/login', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.message === '登入成功') {
                    // noinspection JSUnresolvedVariable
                    window.location.href = '{{ url_for('student_dashboard_page') }}';
                } else {
                    alert(data.message);
                }
            });
        };
    </script>
</body>
</html>
