<!DOCTYPE html>
<html>
<head>
    <title>自動提交 PIN 碼</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f7f7f7;
        }
        .auto-submit-container {
            margin-top: 100px;
            max-width: 500px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="auto-submit-container shadow">
            <h2>正在提交 PIN 碼...</h2>
            <p>請稍候，正在處理您的簽到。</p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // 獲取 URL 中的 pin_code 參數
        const urlParams = new URLSearchParams(window.location.search);
        const pin_code = urlParams.get('pin_code');

        // 檢查是否已登入
        fetch('/check_login', {
            method: 'GET',
            credentials: 'include'
        })
        .then(response => response.json())
        .then(data => {
            if (data.logged_in && data.user_type === 'student') {
                // 已登入，直接提交 PIN 碼
                submitPin(pin_code);
            } else {
                // 未登入，跳轉到登入頁面
                alert('請先登入');
                window.location.href = '{{ url_for('student_login_page') }}';
            }
        });

        function submitPin(pin_code) {
            fetch('/student/submit_pin', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({pin_code})
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                window.location.href = '{{ url_for('student_dashboard_page') }}';
            });
        }
    </script>
</body>
</html>
