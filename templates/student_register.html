<!DOCTYPE html>
<html>
<head>
    <title>學生註冊</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f7f7f7;
        }
        .register-container {
            margin-top: 100px;
            max-width: 400px;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="register-container shadow">
            <h2 class="text-center mb-4">學生註冊</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="student_id">學號</label>
                    <input type="text" class="form-control" id="student_id" name="student_id" required>
                </div>
                <div class="form-group">
                    <label for="password">密碼</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">註冊</button>
            </form>
            <p class="text-center mt-3">已有帳號？<a href="{{ url_for('student_login_page') }}">登入</a></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.getElementById('registerForm').onsubmit = function(e) {
            e.preventDefault();
            const data = {
                student_id: this.student_id.value,
                password: this.password.value
            };
            fetch('/student/register', {
                method: 'POST',
                credentials: 'include',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                if (data.message === '註冊成功') {
                    window.location.href = '{{ url_for('student_login_page') }}';
                }
            });
        };
    </script>
</body>
</html>
